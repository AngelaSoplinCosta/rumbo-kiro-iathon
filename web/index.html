<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rumbo — Hoy</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="estilos.css" />
  <style>
    .sk { background: linear-gradient(90deg,#eef2f7 25%,#e2e8f0 37%,#eef2f7 63%); background-size:400% 100%; animation:shimmer 1.3s infinite; border-radius:14px; height:150px }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="auth.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script>
    if (AUTH.proteger()) {
      const riesgoMedio = localStorage.getItem("rumbo_riesgo") === "medio";
      const centro = `
        <div class="centro-cab">
          <div>
            <h1>Buenos días, Lucía 👋</h1>
            <p class="sub">Sube tus PDFs y arma tu ruta de estudio.</p>
          </div>
          <span class="ritmo ${riesgoMedio ? "medio" : "bajo"}">${riesgoMedio ? "🟡 Retoma con algo corto" : "🟢 Vas a buen ritmo"}</span>
        </div>

        <div class="banner mt">📄 <b>Caso de uso:</b> sube uno o varios PDFs y Rumbo te arma la ruta con IA.
          <a href="subir.html" style="font-weight:700">Probar ahora →</a></div>

        ${riesgoMedio ? `<div class="banner aviso mt">¿Día complicado? Una <b>sesión de 5 minutos</b> mantiene tu racha. <a href="sesion.html" style="font-weight:700">Empezar →</a></div>` : ""}

        <div class="seccion-tit"><h2>Tus cursos</h2>
          <a class="btn chico" href="subir.html">+ Nuevo</a></div>
        <div class="fila-cards" id="cursos"><div class="sk"></div><div class="sk"></div></div>`;
      montarApp({ activo: "hoy", centro });

      const colores = ["#ffe4e6", "#dbeafe", "#ede9fe", "#dcfce7"];
      const iconos = ["🧲", "🧮", "🧪", "📖"];
      const demo = `
        <a class="card-curso" href="espacio.html?demo=1">
          <div class="hero" style="background:#fef3c7"><span class="tag">DEMO</span>🎃</div>
          <div class="cuerpo"><b>Física I (Demo)</b><small>Curso de ejemplo</small>
            <div class="prog"><span>Ver ejemplo →</span></div></div></a>`;
      const subir = `
        <a class="card-curso" href="subir.html">
          <div class="hero" style="background:#eef2ff"><span class="tag">Nuevo</span>⬆️</div>
          <div class="cuerpo"><b>Subir PDFs → ruta</b><small>Genera tu ruta real</small>
            <div class="prog"><span>Probar ahora →</span></div></div></a>`;

      async function cargarCursos() {
        let reales = "";
        try {
          const resp = await fetch(API_URL + "/cursos");
          if (resp.ok) {
            const { cursos } = await resp.json();
            reales = cursos.map((c, i) => `
              <a class="card-curso" href="espacio.html?id=${c.id}">
                <div class="hero" style="background:${colores[i % colores.length]}"><span class="tag">${c.totalDocumentos} doc</span>${iconos[i % iconos.length]}</div>
                <div class="cuerpo"><b>${c.nombre}</b><small>${c.totalTemas} temas · ${c.dias} días</small>
                  <div class="prog"><span>Examen ${c.fechaExamen}</span><span>Abrir →</span></div></div></a>`).join("");
          }
        } catch (e) { /* sin red: solo demo */ }
        document.getElementById("cursos").innerHTML = reales + demo + subir;
      }
      cargarCursos();
    }
  </script>
</body>
</html>
