<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rumbo — Espacios</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="estilos.css" />
  <style>
    .sk { background: linear-gradient(90deg,#eef2f7 25%,#e2e8f0 37%,#eef2f7 63%); background-size:400% 100%; animation:shimmer 1.3s infinite; border-radius:14px; height:150px }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="auth.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script>
    if (AUTH.proteger()) {
      const centro = `
        <div class="centro-cab">
          <div><h1>Tus espacios</h1><p class="sub">Un espacio por curso o examen.</p></div>
          <a class="btn" href="subir.html">+ Subir PDFs y generar ruta</a>
        </div>
        <div class="fila-cards" id="grid">
          <div class="sk"></div><div class="sk"></div><div class="sk"></div>
        </div>`;
      montarApp({ activo: "espacios", centro, derecho: false });

      const colores = ["#ffe4e6", "#dbeafe", "#ede9fe", "#dcfce7", "#fef3c7"];
      const iconos = ["🧲", "🧮", "🧪", "📖", "🧠"];

      function fijas() {
        return `
          <a class="card-curso" href="subir.html">
            <div class="hero" style="background:#eef2ff"><span class="tag">Nuevo</span>⬆️</div>
            <div class="cuerpo"><b>Subir PDFs → ruta</b><small>Genera tu ruta desde tu material</small>
              <div class="prog"><span>Probar ahora →</span></div></div></a>
          <a class="card-curso" href="espacio.html?demo=1">
            <div class="hero" style="background:#fef3c7"><span class="tag">DEMO</span>🎃</div>
            <div class="cuerpo"><b>Física I (Demo)</b><small>Curso de ejemplo para la demo</small>
              <div class="prog"><span>Ver ejemplo →</span></div></div></a>
          <a class="card-curso" href="amigos.html">
            <div class="hero" style="background:#dcfce7"><span class="tag">Compartida</span>🤝</div>
            <div class="cuerpo"><b>Unirte a una ruta</b><small>Copia la ruta de un amigo</small>
              <div class="prog"><span>Ver rutas compartidas →</span></div></div></a>`;
      }

      async function cargar() {
        let cards = "";
        try {
          const resp = await fetch(API_URL + "/cursos");
          if (resp.ok) {
            const { cursos } = await resp.json();
            cards = cursos.map((c, i) => `
              <a class="card-curso" href="espacio.html?id=${c.id}">
                <div class="hero" style="background:${colores[i % colores.length]}"><span class="tag">${c.totalDocumentos} doc</span>${iconos[i % iconos.length]}</div>
                <div class="cuerpo"><b>${c.nombre}</b><small>${c.totalTemas} temas · ruta de ${c.dias} días</small>
                  <div class="prog"><span>Examen ${c.fechaExamen}</span><span>Abrir →</span></div></div></a>`).join("");
          }
        } catch (e) { /* sin red: solo tarjetas fijas */ }
        document.getElementById("grid").innerHTML = cards + fijas();
      }
      cargar();
    }
  </script>
</body>
</html>
