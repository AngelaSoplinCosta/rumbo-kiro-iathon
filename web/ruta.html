<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rumbo — Ruta</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div id="app"></div>
  <script src="auth.js"></script>
  <script src="comun.js"></script>
  <script>
    if (AUTH.proteger()) {
      const reorg = localStorage.getItem("rumbo_riesgo") === "medio";
      const guardado = localStorage.getItem("rumbo_curso");

      let titulo, subtitulo, nodos;
      if (guardado) {
        // Ruta generada de verdad desde un PDF.
        const curso = JSON.parse(guardado);
        const ses = curso.ruta.sesiones;
        titulo = curso.nombre;
        subtitulo = `${curso.temas.length} temas · ruta de ${curso.ruta.dias} días${curso.ruta.modoRescate ? " · modo rescate" : ""}`;
        nodos = ses.map((s, i) => {
          const ico = s.tipo === "simulacro" ? "📝" : (i === 0 ? "▶" : "📗");
          const clase = i === 0 ? "encurso" : "";
          const linea = i < ses.length - 1 ? '<span class="linea"></span>' : "";
          return `<li><span class="nodo ${clase}">${ico}</span><span class="txt"><b>${s.temas.join(", ")}</b><small>${s.fecha} · ${s.minutos} min</small></span>${linea}</li>`;
        }).join("");
      } else {
        titulo = "Tu camino";
        subtitulo = "Física I · Nivel 3 · 38% completado";
        nodos = DEMO.temas.map((t, i) => {
          let ico = "○";
          if (t.estado === "completado") ico = "✓";
          else if (t.estado === "encurso") ico = "▶";
          else if (t.estado === "bloqueado") ico = "🔒";
          else if (t.tipo === "simulacro") ico = "📝";
          else if (t.tipo === "examen") ico = "🎯";
          const linea = i < DEMO.temas.length - 1 ? '<span class="linea"></span>' : "";
          return `<li><span class="nodo ${t.estado}">${ico}</span><span class="txt"><b>${t.nombre}</b><small>${t.dia}</small></span>${linea}</li>`;
        }).join("");
      }

      const centro = `
        <div class="centro-cab">
          <div><h1>${titulo}</h1><p class="sub">${subtitulo}</p></div>
          <a class="btn" href="sesion.html">Continuar →</a>
        </div>
        ${guardado ? `<div class="banner">Esta ruta se generó desde tu PDF. <a href="subir.html" style="font-weight:700">Subir otro →</a></div>` : ""}
        ${reorg ? `<div class="banner aviso">🔄 Reorganizamos tu ruta: <b>Dinámica</b> pasa al viernes. Nada se acumula.</div>` : ""}
        <div class="tarjeta"><ul class="camino">${nodos}</ul></div>`;
      montarApp({ activo: "espacios", centro });
    }
  </script>
</body>
</html>
